<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Ratings</title>
</head>
<body>
    <main>
        <h1>Rating details</h1>

        <p>Name: <span th:text="${rating.name}"></span></p>
        <p>Email: <span th:text="${rating.email}"></span></p>
        <p>Role: <span th:text="${rating.roleType}"></span></p>
        <p>Clarity: <span th:text="${rating.clarity}"></span></p>
        <p>Niceness: <span th:text="${rating.niceness}"></span></p>
        <p>Knowledge: <span th:text="${rating.knowledgeableScore}"></span></p>
        <p>Overall score: <span th:text="${rating.overallScore}"></span></p>
        <p>Comment: <span th:text="${rating.comment}"></span></p>
        <p>Created at: <span th:text="${rating.createdAt}"></span></p>
        <p>Updated at: <span th:text="${rating.updatedAt}"></span></p>

        <p><a href="/ratings/main">Back to ratings</a></p>
    </main>
</body>
</html>
